<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131310" media="(prefers-color-scheme: dark)" />
    <title>Scroll the Gita — Daily Wisdom</title>
    <meta
      name="description"
      content="One Bhagavad Gita teaching each day, plus the complete scripture — a calm reader with streaks, bookmarks and topics."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+Devanagari:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('stg:v2') || '{}');
        var t = (s.settings && s.settings.theme) || 'auto';
        var dark =
          t === 'dark' ||
          (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">ॐ</span>
          <span class="brand-name">Scroll the Gita</span>
        </div>
        <div class="now" id="now" hidden>
          <div class="now-chapter" id="now-chapter"></div>
          <div class="now-ref" id="now-ref"></div>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="btn-account" aria-label="Account — sign in" title="Account">
            <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="12" cy="8.6" r="3.4" />
              <path d="M5.2 20c.8-3.4 3.6-5.4 6.8-5.4s6 2 6.8 5.4" stroke-linecap="round" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-theme" aria-label="Switch to dark mode" title="Toggle theme">
            <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
              <path
                id="theme-icon"
                d="M12 3a9 9 0 1 0 9 9c0-.3 0-.6-.05-.9A7 7 0 0 1 12.9 3.05C12.6 3 12.3 3 12 3Z"
                fill="currentColor"
              />
            </svg>
          </button>
        </div>
      </header>

      <main id="main">
        <section id="view-today" class="view" aria-labelledby="today-title"></section>

        <section id="view-explore" class="view" hidden>
          <div class="vframe" id="vframe">
            <header class="rail rail-top" id="rail-top">
              <div class="rail-progress" aria-hidden="true"><span id="chapter-progress"></span></div>
              <div class="rail-row">
                <div class="rail-context">
                  <span class="rail-ch-num" id="rail-ch-num">Chapter 1</span>
                  <span class="rail-ch-name" id="rail-ch-name">Arjuna’s Dilemma</span>
                </div>
                <p class="rail-count" id="rail-count">Verse 1 of 47</p>
                <div class="rail-actions">
                  <button class="rail-btn" id="rail-prev" type="button" aria-label="Previous verse">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
                  </button>
                  <button class="rail-btn" id="rail-next" type="button" aria-label="Next verse">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                  </button>
                </div>
              </div>
              <div class="jumpbar" id="jumpbar"></div>
            </header>

            <div class="vbody" id="vbody">
              <div class="feed" id="feed" tabindex="-1"></div>
            </div>

            <footer class="rail rail-bottom" id="rail-bottom">
              <button class="rail-btn rail-btn-text" data-nav="prev" type="button">
                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
                <span>Prev</span>
              </button>
              <button class="rail-btn" data-nav="home" type="button" aria-label="First verse">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6.5 8 6.5M6.5 10v9h11v-9"/></svg>
              </button>
              <button class="rail-btn rail-btn-text" data-nav="next" type="button">
                <span>Next</span>
                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
              </button>
            </footer>

            <section class="chapter-card" id="chapter-card" hidden aria-label="Chapter introduction"></section>
          </div>
        </section>

        <section id="view-topics" class="view" hidden aria-labelledby="topics-title"></section>

        <section id="view-saved" class="view" hidden aria-labelledby="saved-title"></section>

        <section id="view-journey" class="view" hidden aria-labelledby="journey-title"></section>
      </main>

      <nav class="tabbar" aria-label="Primary">
        <button data-route="explore" class="tab" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 6.6C10.5 5.1 8.5 4.5 4.8 4.6v13c3.7-.1 5.7.5 7.2 2 1.5-1.5 3.5-2.1 7.2-2v-13c-3.7-.1-5.7.5-7.2 2Zm0 0v13"/></svg>
          <span>Read</span>
        </button>
        <button data-route="today" class="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
          <span>Today</span>
        </button>
        <button data-route="topics" class="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 11V5.5A1.5 1.5 0 0 1 5.5 4H11l8.4 8.4a1.5 1.5 0 0 1 0 2.1l-4.9 4.9a1.5 1.5 0 0 1-2.1 0Z"/><circle cx="8.2" cy="8.2" r="1.2" fill="currentColor" stroke="none"/></svg>
          <span>Topics</span>
        </button>
        <button data-route="saved" class="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M7 4.6h10a.9.9 0 0 1 .9.9V20l-5.9-3.7L6.1 20V5.5a.9.9 0 0 1 .9-.9Z"/></svg>
          <span>Saved</span>
        </button>
        <button data-route="journey" class="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 19h16M6.8 16V9.8M11.3 16V5.8M15.8 16v-7.8M20.2 16v-3.6"/></svg>
          <span>Journey</span>
        </button>
      </nav>

      <div class="sheet-backdrop" id="backdrop" hidden></div>

      <section class="sheet" id="sheet-translator" role="dialog" aria-modal="true" aria-labelledby="sheet-translator-title" hidden>
        <div class="sheet-head">
          <h2 id="sheet-translator-title">Choose a translation</h2>
          <button class="icon-btn" data-close aria-label="Close">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
          </button>
        </div>
        <ul class="sheet-list" id="translator-list"></ul>
      </section>

      <section class="sheet" id="sheet-chapters" role="dialog" aria-modal="true" aria-labelledby="sheet-chapters-title" hidden>
        <div class="sheet-head">
          <h2 id="sheet-chapters-title">Chapters</h2>
          <button class="icon-btn" data-close aria-label="Close">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
          </button>
        </div>
        <ul class="sheet-list" id="chapter-list"></ul>
      </section>

      <div class="loader" id="loader" role="status" aria-live="polite">
        <div class="loader-inner">
          <span class="spinner" aria-hidden="true"></span>
          <p class="loader-text">Opening the Gita…</p>
          <button class="btn btn-secondary" id="loader-retry" hidden>Retry</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
