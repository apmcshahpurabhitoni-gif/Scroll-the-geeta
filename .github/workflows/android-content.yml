name: Android content integrity

on:
  pull_request:
    paths:
      - "src/data/**"
      - "scripts/export-android-content.mjs"
      - "docs/android/CONTENT_CONTRACT.md"
      - ".github/workflows/android-content.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and export canonical content
        run: node scripts/export-android-content.mjs
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - name: Upload Android scripture bundle
        uses: actions/upload-artifact@v4
        with:
          name: scroll-the-geeta-scripture-assets
          path: android/app/src/main/assets/scripture/
          if-no-files-found: error
          retention-days: 14
